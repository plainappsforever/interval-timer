appId: ${APP_ID}
name: Preview video v2 setup (R6 part 2)
tags:
  - screenshots
---
# Fresh install that starts in the given language (templates and interval names are stored in that language at first launch).
# Release build only (no dev launcher to pick). One shared circuit is imported so "My timers" has a named circuit.
- launchApp:
    stopApp: true
    arguments:
      -AppleLanguages: "(${LANGTAG})"
      -AppleLocale: "${LOCALE}"
    clearState: true
    arguments:
      -AppleLanguages: "(${LANGTAG})"
      -AppleLocale: "${LOCALE}"
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
# Owner order 2026-11-16: no sound from the simulator. Voice cues OFF in the app's settings (default stays on in code), and the
# run screen's Sound toggle is tapped off at the start of every run below.
- tapOn:
    id: open-settings
- extendedWaitUntil:
    visible:
      id: set-voice
    timeout: 10000
- tapOn:
    id: set-voice
- launchApp:
    stopApp: true
    arguments:
      -AppleLanguages: "(${LANGTAG})"
      -AppleLocale: "${LOCALE}"
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 15000
- openLink: ${SCHEME}://t?d=eyJ2IjoxLCJuIjoiUXVpY2sgc2V0IiwiYiI6W3siciI6MiwiaSI6W3sibiI6IldvcmsiLCJzIjo0LCJ0Ijoid29yayJ9LHsibiI6IlJlc3QiLCJzIjoyLCJ0IjoicmVzdCJ9XSwibiI6IlF1aWNrIn1dfQ
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: import-preview
    timeout: 20000
- tapOn:
    id: import-save
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
